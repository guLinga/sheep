# 网站标题
title: 迦南书简
# 网站标题后缀
suffix: Quiet
# 作者名称
author: 迦南书简
# 网站关键字
keyword: 迦南书简
#false是否开启文章背景图显示(随机图片)
is_article_img: true
# 网站描述
web_description: 描述
# 首页文章布局 默认 'card' 可选择 'block-card'
home_layout: block-card
# 导航名称
menus_title:
  home: 文章
  picture: 相册
  task: 任务
  plan: 读经计划
  library: 图书馆
  # archive: ARCHIVE
  # categories: CATEGORIES
  # tags: TAGS
  # links: LINKS
  # about: ABOUT
# 导航 （不建议修改）
baseUrl: 
menus:
  home: /
  picture: /picture
  task: /task
  plan: /plan
  library: /library
  # archive: /archives
  # categories: /categories
  # tags: /tags
  # links: /links
  # about: /about

# logo
logo: /image/logo.png
# 网页标签上那个小图标 一定要用本地存储
icon: /image/favicon.ico
# 每个页面的展示的图标和一句话
headers:
  home: { message: '迦南书简', icon: '/image/logo.png' }
  archives: {
      # 这里会替换掉两个变量{ year 年，number 总数 } 当然也可以不写这两个变量
      message: '居然用了 year 年一共才写了 number 篇文章!',
      icon: 'https://cdn.jsdelivr.net/gh/duogongneng/MyBlogImg/imgicon-remixicon.svg',
    }
  tags:
    {
      message: '这里是一些展示的标签',
      icon: 'https://cdn.jsdelivr.net/gh/duogongneng/MyBlogImg/imgtags.svg',
    }
  links:
    {
      message: '我和我的小伙伴们',
      icon: 'https://cdn.jsdelivr.net/gh/duogongneng/MyBlogImg/imga20r7-cftji.svg',
    }
  categories:
    {
      message: '文章分类',
      icon: 'https://cdn.jsdelivr.net/gh/duogongneng/MyBlogImg/imgblogmyCategory.svg',
    }
  library:
    {
      message: '图书馆',
      icon: 'https://cdn.jsdelivr.net/gh/duogongneng/MyBlogImg/imgicon-remixicon.svg',
    }

# 网页访问统计
web_analytics:
  enable: false #需要改为true
  baidu: 4b5fe1472f22fadsfs # （替换）百度统计的 Key，参见 https://tongji.baidu.com/sc-web/10000033910/home/site/getjs?siteId=13751376 代码获取中 hm.js? 后边的字符串
# 评论
gitalk:
  clientID: 02b3c # （需要替换）GitHub Application Client ID.
  clientSecret: adfc7b4 #（需要替换）GitHub Application Client Secret.
  repo: gimment #（需要替换）GitHub repository.
  owner: duneng #（需要替换）GitHub repository 所有者，可以是个人或者组织。
  admin: ['duneng'] #（需要替换）GitHub repository 的所有者和合作者 (对这个 repository 有写权限的用户)。

# 底部显示的图标（github 或者其他）
bottomIcon:
  #可以多个
  - {
      #描述名称
      name: 'Github',
      #图标
      iconLink: 'https://cdn.jsdelivr.net/gh/duogongneng/MyBlogImg/imggithub.png',
      #跳转链接
      toUrl: 'https://github.com/79E/hexo-theme-quiet',
    }
# 友情链接
linksList:
  - {
      title: 'Quiet',
      intro: '收藏回忆与分享技术的地方',
      link: 'https://github.com/79E/hexo-theme-quiet',
      image: 'https://cdn.jsdelivr.net/gh/duogongneng/MyBlogImg/imgIMG_7327.jpeg',
    }

#默认的cover (默认缩略图) 在没有填写（这里可以替换（可以是api也可以是固定的图））
# https://api.ixiaowai.cn/gqapi/gqapi.php
# https://tuapi.eees.cc/api.php?type=302&category=fengjing
# default_cover: https://api.ixiaowai.cn/gqapi/gqapi.php
# default_cover: https://gulinga.github.io/image/cover.png
default_cover: https://gulinga-github-io.pages.dev/image/cover.png

aplayer:
  meting: true
  asset_inject: true

# 全站访问门禁（纯前端；登录 UI 为 8 格横排各 1 字符，拼成串后与下方哈希或明文一致）
site_gate:
  enable: true
  # 登录成功后写入 localStorage 的值，请改为长随机串
  session_token: 'change-me-to-a-long-random-string'
  # 若填写则最优先（小写 hex，32 位）。生成: node -e "console.log(require('crypto').createHash('md5').update('你的密码','utf8').digest('hex'))"
  password_md5: '30396E1F9721C5BC3A9CD7E729A7D1BB'
  # 明文密码（会出现在登录页 HTML，仅适合个人站）；有 password_md5 时不会用到
  password: ''
  # 次优先 SHA-256（小写 hex）；有 password_md5 时不会用到
  password_sha256: ''